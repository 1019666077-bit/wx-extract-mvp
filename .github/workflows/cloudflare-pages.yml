# Publishes the static site to Cloudflare Pages project eachsound.
# Preview host: https://eachsound.pages.dev. Final domain later: https://eachsound.com.
# Create the project in the dashboard with Direct Upload. Do not connect Git.
# GitHub Pages is unchanged. site.config.json origin stays on GitHub Pages for now.
# This job does nothing until both GitHub secrets exist.
name: Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci
      - run: node scripts/build-pages.js
      - run: node scripts/stage-pages.js

      - name: Skip until the Cloudflare token exists
        id: gate
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$TOKEN" ] && [ -n "$ACCOUNT" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            echo "CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID is unset. GitHub Pages stays the live host."
          fi

      - name: Deploy dist to Cloudflare Pages
        if: steps.gate.outputs.deploy == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=eachsound --commit-dirty=true
