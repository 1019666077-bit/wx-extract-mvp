<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Let's Learn English Lesson 1</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div class="page">
    <header class="header">
      <p class="eyebrow">VOA Learning English</p>
      <h1 id="lesson-title">Let's Learn English Lesson 1</h1>
      <p id="lesson-subtitle" class="subtitle"></p>
    </header>
    <section class="video-section" aria-label="Lesson video">
      <div class="video-wrap">
        <iframe id="lesson-video" title="Let's Learn English Lesson 1 video" src="https://www.youtube.com/embed/WR9_nsLyaEY" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen loading="lazy"></iframe>
      </div>
    </section>
    <section class="dialogue-section" aria-label="Dialogue">
      <h2>Dialogue · 对话</h2>
      <div id="dialogue" class="dialogue"></div>
    </section>
    <section class="quiz-section" aria-label="Quiz">
      <h2>Quiz · 练习</h2>
      <form id="quiz-form"></form>
      <div class="quiz-actions">
        <button type="submit" form="quiz-form" id="submit-quiz" class="btn primary">Check answers</button>
        <button type="button" id="reset-quiz" class="btn">Reset</button>
      </div>
      <p id="quiz-result" class="quiz-result" role="status" aria-live="polite"></p>
    </section>
    <footer class="footer">
      <p id="attribution"></p>
    </footer>
  </div>
  <script src="js/app.js"></script>
</body>
</html>
