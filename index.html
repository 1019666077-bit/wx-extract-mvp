<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Let's Learn English Lesson 1</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div class="page">
    <header class="header">
      <p class="eyebrow">VOA Learning English</p>
      <h1 id="lesson-title">Let's Learn English Lesson 1</h1>
      <p id="lesson-subtitle" class="subtitle"></p>
    </header>
    <section class="video-section" aria-label="Lesson video">
      <div class="video-wrap">
        <video id="lesson-video" controls playsinline preload="metadata" poster="">
          Your browser does not support video.
        </video>
      </div>
      <p class="video-fallback" id="video-fallback" hidden>
        <a id="youtube-link" href="#" target="_blank" rel="noopener">Open on YouTube</a>
        · <a id="voa-page-link" href="https://learningenglish.voanews.com/a/lets-learn-english-lesson-one/3111026.html" target="_blank" rel="noopener">VOA lesson page</a>
      </p>
    </section>
    <section class="dialogue-section" aria-label="Dialogue">
      <h2>Dialogue · 对话</h2>
      <div id="dialogue" class="dialogue"></div>
    </section>
    <section class="quiz-section" aria-label="Quiz">
      <h2>Quiz · 练习</h2>
      <form id="quiz-form"></form>
      <div class="quiz-actions">
        <button type="submit" form="quiz-form" id="submit-quiz" class="btn primary">Check answers</button>
        <button type="button" id="reset-quiz" class="btn">Reset</button>
      </div>
      <p id="quiz-result" class="quiz-result" role="status" aria-live="polite"></p>
    </section>
    <footer class="footer">
      <p id="attribution"></p>
    </footer>
  </div>
  <script src="js/app.js"></script>
</body>
</html>
