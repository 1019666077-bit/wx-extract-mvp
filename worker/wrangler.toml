# No secrets in this file. API keys and private keys are Worker secrets.
# ORDERS ids are KV namespace ids (voa-lle-orders / voa-lle-orders-preview), not secrets.
name = "voa-lle-unlock"
main = "src/index.js"
compatibility_date = "2026-09-28"

[vars]
# Pancake uses one host. Test and Live are different API keys and webhook public keys.
WAFFO_API_BASE = "https://api.waffo.ai"
# test or prod. Must match the API key and the webhook public key.
PANCAKE_MODE = "test"
# Copied from site.config.json by scripts/build-pages.js. Empty keeps checkout closed.
PANCAKE_PRODUCT_MONTHLY = ""
PANCAKE_PRODUCT_QUARTERLY = ""
# Copied from site.config.json origin by scripts/build-pages.js. Do not edit by hand.
ALLOWED_ORIGIN = "https://1019666077-bit.github.io/wx-extract-mvp"
# Copied from site.config.json termsVersion by scripts/build-pages.js.
TERMS_VERSION = "2026-09-28-law"

[[kv_namespaces]]
binding = "ORDERS"
id = "84110c8900934ac6abe4841117e9d8a3"
preview_id = "49aac2630d6b4030bbbd739bcbe707eb"

# Sandbox only. `wrangler deploy --env sandbox` publishes voa-lle-unlock-sandbox
# and binds the preview KV. It does not deploy the production worker name or the
# production namespace. Product ids are filled in CI and are not committed.
[env.sandbox]
name = "voa-lle-unlock-sandbox"
workers_dev = true

[env.sandbox.vars]
WAFFO_API_BASE = "https://api.waffo.ai"
PANCAKE_MODE = "test"
PANCAKE_PRODUCT_MONTHLY = ""
PANCAKE_PRODUCT_QUARTERLY = ""
ALLOWED_ORIGIN = "https://sandbox.eachsound.pages.dev"
TERMS_VERSION = "2026-09-28-law"

[[env.sandbox.kv_namespaces]]
binding = "ORDERS"
id = "49aac2630d6b4030bbbd739bcbe707eb"
