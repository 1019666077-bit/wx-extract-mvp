# No secrets in this file. API keys and private keys are Worker secrets.
# The KV id below is a placeholder until `wrangler kv namespace create`.
name = "voa-lle-unlock"
main = "src/index.js"
compatibility_date = "2026-09-28"

[vars]
# Pancake uses one host. Test and Live are different API keys and webhook public keys.
WAFFO_API_BASE = "https://api.waffo.ai"
# test or prod. Must match the API key and the webhook public key.
PANCAKE_MODE = "test"
# Copied from site.config.json by scripts/build-pages.js. Empty keeps checkout closed.
PANCAKE_PRODUCT_MONTHLY = ""
PANCAKE_PRODUCT_QUARTERLY = ""
# Copied from site.config.json origin by scripts/build-pages.js. Do not edit by hand.
ALLOWED_ORIGIN = "https://1019666077-bit.github.io/wx-extract-mvp"
# Copied from site.config.json termsVersion by scripts/build-pages.js.
TERMS_VERSION = "2026-09-28-norefund"

[[kv_namespaces]]
binding = "ORDERS"
id = "replace_me"
preview_id = "replace_me"
