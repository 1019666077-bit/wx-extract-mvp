    <header class="header">
      <p class="eyebrow">聲聲慢 · 非 VOA 官方</p>
      <h1>付款之後</h1>
      <p class="subtitle">用 Waffo 付完月付 US$5.99（30 天）或季卡 US$13.99（90 天）後，會回到本頁。一次性付款，不自動續費。確認到賬後自動開通，不用再做別的操作。</p>
    </header>
    <section class="pricing-section" aria-label="付款確認">
      <h2>自動開通</h2>
      <!--return-status:start-->
<p id="return-status" class="pay-note" data-live="false">付款通道尚未開放。現在開啟本頁不會解鎖課程。</p>
<!--return-status:end-->
      <div class="quiz-actions">
        <a class="btn" href="index.html">返回課表</a>
        <a class="btn" href="pricing.html">檢視方案</a>
      </div>
      <h3 class="pay-steps-title">找回開通</h3>
      <form id="recover-form" class="redeem-form">
        <label for="recover-order">訂單號
          <input id="recover-order" name="order" type="text" autocomplete="off" maxlength="64" />
        </label>
        <label for="recover-email">付款時填寫的郵箱
          <input id="recover-email" name="email" type="email" autocomplete="email" maxlength="64" />
        </label>
        <button type="submit" class="btn">找回開通</button>
        <p id="recover-result" class="quiz-result" role="status" aria-live="polite"></p>
      </form>
    </section>
    <footer class="footer">
